name: Nightly calendar reconcile

# Rolls overdue events forward on the days nobody opens the app. The in-app
# trigger covers the days you do — this covers the ones you don't, which is the
# case the whole feature exists for.
#
# GitHub cron is best effort and is disabled automatically after 60 days of
# repository inactivity. If that bites, the fallback is an asyncio loop in the
# FastAPI lifespan, which is safe here because fly.toml pins exactly one
# always-on machine.
on:
  schedule:
    # 07:10 UTC daily — a few minutes past the hour, since scheduled runs
    # cluster (and get delayed) exactly on it.
    - cron: '10 7 * * *'
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reconcile
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_URL and CRON_SECRET repository secrets must both be set."
            exit 1
          fi

          status=$(curl -sS -o response.json -w '%{http_code}' \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 300 \
            -X POST "$API_URL/api/integrations/google/sync/reconcile" \
            -H "X-Cron-Secret: $CRON_SECRET")

          echo "HTTP $status"
          cat response.json
          echo

          if [ "$status" != "200" ]; then
            echo "Reconcile failed."
            exit 1
          fi
